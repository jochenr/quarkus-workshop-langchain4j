# HTTP configuration
quarkus.http.port=8080

# Application name
quarkus.application.name=car-management

# Logging configuration
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.carmanagement".level=DEBUG

# Development mode settings
%dev.quarkus.http.port=8080
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."dev.langchain4j.agentic".level=DEBUG

# Production mode settings
%prod.quarkus.log.console.level=INFO

# Disable banner in console
quarkus.banner.enabled=false



# If you want to use a different provider or run an LLM on your local machine,
# uncomment this line and update the url/port accordingly.
#quarkus.langchain4j.openai.base-url=http://localhost:35000/v1
# quarkus.langchain4j.openai.base-url=http://127.0.0.1:11434/v1
# quarkus.langchain4j.openai.base-url=http://localhost:11434/v1

quarkus.langchain4j.openai.base-url=http://[::1]:11434/v1

# AI model configuration
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:ollama}
# quarkus.langchain4j.openai.chat-model.model-name=qwen3:0.6b
quarkus.langchain4j.openai.chat-model.model-name=qwen3:1.7b
# quarkus.langchain4j.openai.chat-model.model-name=qwen3:4b
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=600s





quarkus.transaction-manager.default-transaction-timeout=900S
